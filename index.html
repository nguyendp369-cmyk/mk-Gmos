<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Mật Khẩu</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 340px;
            text-align: center;
            border: 1px solid #333;
        }
        h3 {
            margin-top: 0;
            color: #ffffff;
        }
        button {
            background: #2563eb;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background: #1d4ed8;
        }
        button:active {
            transform: scale(0.98);
        }
        .output-box {
            margin-top: 20px;
            background: #262626;
            padding: 14px;
            border-radius: 8px;
            text-align: left;
            display: none;
            border: 1px solid #404040;
        }
        .label {
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 4px;
        }
        .pwd-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #171717;
            padding: 10px 12px;
            border-radius: 6px;
            margin-bottom: 12px;
            cursor: pointer;
            border: 1px dashed #4ade80;
        }
        .pwd {
            font-size: 20px;
            font-weight: bold;
            color: #4ade80;
            font-family: monospace;
            letter-spacing: 1px;
        }
        .copy-badge {
            font-size: 11px;
            background: #374151;
            color: #d1d5db;
            padding: 4px 8px;
            border-radius: 4px;
        }
        .hash-str {
            font-size: 11px;
            color: #a3a3a3;
            font-family: monospace;
            word-break: break-all;
        }
    </style>
</head>
<body>

<div class="card">
    <h3>Tool Lấy Mật Khẩu</h3>
    <button onclick="generatePassword()">Bấm để lấy mật khẩu</button>
    
    <div id="result" class="output-box">
        <div class="label">Mật khẩu (chạm vào khung để copy):</div>
        <div class="pwd-container" onclick="copyPass()">
            <span class="pwd" id="pwdText"></span>
            <span class="copy-badge" id="copyStatus">Copy</span>
        </div>
        <div class="label">Chuỗi hash:</div>
        <div class="hash-str" id="hashText"></div>
    </div>
</div>

<script>
const SECRET_SALT = "PHUONGMQV_GMOS_2026_MOS_AUTH";

function getSlotHour(hour) {
    return hour - (hour % 2);
}

function pad2(num) {
    return String(num).padStart(2, '0');
}

async function generatePassword() {
    const now = new Date();
    const vnTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Ho_Chi_Minh"}));

    const year = vnTime.getFullYear();
    const month = pad2(vnTime.getMonth() + 1);
    const day = pad2(vnTime.getDate());
    const slotH = pad2(getSlotHour(vnTime.getHours()));

    const rawPayload = `${year}-${month}-${day}-${slotH}-${SECRET_SALT}`;

    const msgBuffer = new TextEncoder().encode(rawPayload);
    const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const sha = hashArray.map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();

    const checksum = sha.substring(0, 2);
    const password = `@PK${slotH}${day}${month}${checksum}@`;

    document.getElementById('pwdText').textContent = password;
    document.getElementById('hashText').textContent = rawPayload;
    document.getElementById('copyStatus').textContent = "Copy";
    document.getElementById('copyStatus').style.background = "#374151";
    document.getElementById('result').style.display = 'block';
}

function copyPass() {
    const pwd = document.getElementById('pwdText').textContent;
    navigator.clipboard.writeText(pwd).then(() => {
        const badge = document.getElementById('copyStatus');
        badge.textContent = "Đã chép!";
        badge.style.background = "#16a34a";
        badge.style.color = "#fff";
    });
}
</script>

</body>
</html>
